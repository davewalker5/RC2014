# Sourced by both launchers. Samples are optional; without them the bus works silently.
: "${RC2014_SPEECH:=on}"
: "${RC2014_SPEECH_PORT:=31}"
: "${RC2014_SPEECH_READY_BIT:=2}"
: "${RC2014_SPEECH_FALLBACK_MS:=120}"
export RC2014_SPEECH RC2014_SPEECH_PORT RC2014_SPEECH_READY_BIT RC2014_SPEECH_FALLBACK_MS
# Use locally installed samples automatically; an environment override takes precedence.
if [ -d "$PWD/speech-samples" ]; then
    : "${RC2014_SPEECH_SAMPLES:=$PWD/speech-samples}"
    export RC2014_SPEECH_SAMPLES
fi
# Export RC2014_SPEECH_TRACE to a new CSV filename to record accepted codes.
