# Separate LCD window. Environment overrides take precedence.
: "${RC2014_LCD:=on}"       # on or off
: "${RC2014_LCD_PORT:=218}" # Register port in decimal; data port is +1
export RC2014_LCD RC2014_LCD_PORT
# Optional diagnostics (new filenames only, written on normal exit):
# export RC2014_LCD_DUMP=/absolute/path/lcd-state.json
# export RC2014_LCD_SNAPSHOT=/absolute/path/lcd.bmp
