# Sourced by both launchers. Environment overrides take precedence.
: "${RC2014_SID:=8580}"          # 8580, 6581, or off
: "${RC2014_SID_CLOCK:=1000000}" # SID clock Hz (900000..1100000)
: "${RC2014_SID_PORT:=212}"      # Register port; data is port + 1
: "${RC2014_SID_GAIN:=0.5}"      # Host gain 0..1, independent of SID volume
: "${RC2014_SID_OUTPUT:=audio}"  # audio, wav, or both
export RC2014_SID RC2014_SID_CLOCK RC2014_SID_PORT RC2014_SID_GAIN RC2014_SID_OUTPUT
# For wav/both, also export RC2014_SID_WAV to a new absolute filename.
