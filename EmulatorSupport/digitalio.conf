# RC2014 Digital I/O window. Environment overrides take precedence.
: "${RC2014_DIO:=on}"
: "${RC2014_DIO_INPUT_PORT:=1}"
: "${RC2014_DIO_OUTPUT_PORT:=1}"
export RC2014_DIO RC2014_DIO_INPUT_PORT RC2014_DIO_OUTPUT_PORT
# Optional final state on normal exit; choose a new filename:
# export RC2014_DIO_DUMP=/absolute/path/digitalio-state.json
